name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create (for example: v0.1.0)"
        required: true
        type: string

permissions:
  contents: read

env:
  BINARY_NAME: cronk
  CARGO_TERM_COLOR: always
  GITHUB_TOKEN: ${{ github.token }}

jobs:
  prepare:
    name: Validate release request
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.validate.outputs.tag }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Validate tag input
        id: validate
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "tag must be a semantic version with a v prefix (for example: v0.1.0)" >&2
            exit 1
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "tag '$TAG' already exists on origin" >&2
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.target }}
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Cache pinned tooling
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/cronk/mise
            ~/.local/share/mise/installs
            ~/.rustup/toolchains
          key: tooling-${{ runner.os }}-${{ runner.arch }}-release-${{ hashFiles('mise.toml', 'mise.lock', '.config/mise-bootstrap.json') }}
          restore-keys: tooling-${{ runner.os }}-${{ runner.arch }}-release-

      - name: Set up pinned release tooling
        run: just setup-ci release

      - name: Cache cargo and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Set Cargo package version from release tag
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: just release-version "$TAG"

      - name: Build release binary
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: just release-build "${{ matrix.target }}"

      - name: Verify embedded release version
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          GITHUB_SHA: ${{ github.sha }}
          TARGET: ${{ matrix.target }}
        run: just release-check "$TARGET" "$TAG" "$GITHUB_SHA"

      - name: Package release archive
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail

          archive_dir="dist"
          staging_dir="$archive_dir/${BINARY_NAME}-${TARGET}"
          archive_name="${BINARY_NAME}-${TAG}-${TARGET}.tar.gz"

          mkdir -p "$staging_dir"
          cp "target/${TARGET}/release/${BINARY_NAME}" "$staging_dir/"
          cp README.md LICENSE "$staging_dir/"
          tar -C "$archive_dir" -czf "$archive_dir/$archive_name" "$(basename "$staging_dir")"

      - name: Upload release archive
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    name: Create draft GitHub release
    needs:
      - prepare
      - build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download release archives
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          merge-multiple: true
          path: dist

      - name: Create and push tag
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail

          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "tag '$TAG' already exists on origin" >&2
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" "$GITHUB_SHA" -m "Release $TAG"
          git push origin "refs/tags/$TAG"

      - name: Create draft release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: ${{ needs.prepare.outputs.tag }}
          draft: true
          generate_release_notes: true
          files: dist/*.tar.gz
          fail_on_unmatched_files: true

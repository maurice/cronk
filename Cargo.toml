[package]
name = "cronk"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "A keyboard-first, multi-project GitLab workspace"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
directories = "6"
httpdate = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls-native-roots"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
toml = "1.1"
tui-lipan = { version = "=0.18.2", default-features = false, features = ["markdown", "diff-view", "ui-snapshot-png"] }

[dev-dependencies.cargo-husky]
version = "1"
default-features = false
features = ["user-hooks"]

[profile.release]
lto = "thin"
strip = true

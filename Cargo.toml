[package]
name = "cronk"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
description = "A keyboard-first, multi-project GitLab workspace"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
directories = "6"
httpdate = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "unstable-locales"] }
rusqlite = { version = "0.40", features = ["bundled"] }
sha2 = "0.11"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls-native-roots"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_path_to_error = "0.1"
tempfile = "3"
toml = "1.1"
tui-lipan = { version = "=0.18.2", default-features = false, features = ["markdown", "diff-view", "ui-snapshot-png"] }

[dev-dependencies]
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

[dev-dependencies.cargo-husky]
version = "1"
default-features = false
features = ["user-hooks"]

# Keep line-number backtraces without full variable/type debug information.
# The test profile inherits these settings; incremental compilation stays enabled.
[profile.dev]
debug = 1

[profile.release]
lto = "thin"
strip = true

name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  GITHUB_TOKEN: ${{ github.token }}

jobs:
  format:
    name: Check formatting
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Cache pinned tooling
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/cronk/mise
            ~/.local/share/mise/installs
            ~/.rustup/toolchains
          key: tooling-${{ runner.os }}-${{ runner.arch }}-rust-${{ hashFiles('mise.toml', 'mise.lock', '.config/mise-bootstrap.json') }}
          restore-keys: tooling-${{ runner.os }}-${{ runner.arch }}-rust-

      - name: Set up pinned tooling
        run: just setup-ci rust

      - name: Check formatting
        run: just fmt

      - name: Check local development workflow
        run: just workflow-test

  release-build:
    name: Build release binary
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Cache pinned tooling
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/cronk/mise
            ~/.local/share/mise/installs
            ~/.rustup/toolchains
          key: tooling-${{ runner.os }}-${{ runner.arch }}-rust-${{ hashFiles('mise.toml', 'mise.lock', '.config/mise-bootstrap.json') }}
          restore-keys: tooling-${{ runner.os }}-${{ runner.arch }}-rust-

      - name: Set up pinned tooling
        run: just setup-ci rust

      - name: Cache cargo and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: just build-release

  checks:
    name: Build, test, and lint
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Cache pinned tooling
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/cronk/mise
            ~/.local/share/mise/installs
            ~/.rustup/toolchains
          key: tooling-${{ runner.os }}-${{ runner.arch }}-checks-${{ hashFiles('mise.toml', 'mise.lock', '.config/mise-bootstrap.json') }}
          restore-keys: tooling-${{ runner.os }}-${{ runner.arch }}-checks-

      - name: Set up pinned tooling
        run: just setup-ci checks

      - name: Cache cargo and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Lint with Clippy
        run: just lint

      - name: Run tests with nextest
        run: just test-ci

      - name: Run doctests
        run: just doc

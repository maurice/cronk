version: 2
updates:
  # Keep Rust dependency PRs small by default: most crates update one at a time.
  # Only tightly related packages are grouped together.
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
      include: "scope"
    groups:
      serde:
        patterns:
          - "serde"
          - "serde_*"

  # GitHub Actions updates are also kept narrow, with only the matching
  # upload/download artifact pair grouped into the same PR.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:30"
      timezone: "UTC"
    open-pull-requests-limit: 2
    commit-message:
      prefix: "deps"
      include: "scope"
    groups:
      artifact-actions:
        patterns:
          - "actions/download-artifact"
          - "actions/upload-artifact"

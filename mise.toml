# Pinned dev CLIs. Rust itself is pinned in rust-toolchain.toml.
[tool_alias]
nextest = "github:nextest-rs/nextest"
sccache = "github:mozilla/sccache"

[tools]
nextest = { version = "0.9.146", version_prefix = "cargo-nextest-", matching_regex = "^cargo-nextest-.*unknown-linux-gnu\\.tar\\.gz$" }
sccache = { version = "0.18.0", matching_regex = "^sccache-v.*unknown-linux-musl\\.tar\\.gz$" }

[settings]
lockfile = true

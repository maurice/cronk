name: Set up toolchain
description: Install just, the pinned Rust toolchain and the mise-pinned dev CLIs.

runs:
  using: composite
  steps:
    - uses: taiki-e/install-action@v2
      with:
        tool: just

    - uses: jdx/mise-action@v5
      with:
        install: true
        cache: true

    - name: Install pinned Rust toolchain
      shell: bash
      run: rustup toolchain install

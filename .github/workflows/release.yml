name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create (for example: v0.1.0)"
        required: true
        type: string

permissions:
  contents: read

env:
  BINARY_NAME: cronk
  CARGO_TERM_COLOR: always
  GITHUB_TOKEN: ${{ github.token }}
  # Silences git's "initial branch name" hint printed by actions/checkout.
  GIT_CONFIG_COUNT: 1
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  prepare:
    name: Validate release request
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.validate.outputs.tag }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate tag input
        id: validate
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "tag must be a semantic version with a v prefix (for example: v0.1.0)" >&2
            exit 1
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "tag '$TAG' already exists on origin" >&2
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.target }}
    needs: prepare
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install pinned Rust toolchain
        run: rustup toolchain install

      - name: Cache cargo and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Set Cargo package version from release tag
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail

          if [[ "$(grep -c '^version = "0.0.0"$' Cargo.toml)" != 1 ]]; then
            echo "Cargo.toml package version placeholder is missing or ambiguous" >&2
            exit 1
          fi
          sed -i "s/^version = \"0.0.0\"$/version = \"${TAG#v}\"/" Cargo.toml
          # Cold runners need registry metadata even though locked versions are unchanged.
          cargo update --workspace

      - name: Install cross
        # Run outside the checkout so rustup's toolchain-file override warning
        # does not fire, and cap lints so cross's own rustc warnings stay quiet.
        working-directory: ${{ runner.temp }}
        env:
          RUSTFLAGS: --cap-lints allow
        run: cargo install cross --git https://github.com/cross-rs/cross --rev 74e99b2223de06166f8cdcc1af7f1308ec52baf4 --locked

      - name: Build release binary
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: cross build --locked --release --target ${{ matrix.target }} --bin $BINARY_NAME

      - name: Verify embedded release version
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          GITHUB_SHA: ${{ github.sha }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail

          expected="${BINARY_NAME} ${TAG}@${GITHUB_SHA:0:12}"
          actual="$(cross run --locked --release --target "$TARGET" --bin "$BINARY_NAME" -- --version)"
          if [[ "$actual" != "$expected" ]]; then
            echo "Release version mismatch: expected '$expected', got '$actual'" >&2
            exit 1
          fi
          echo "$actual"

      - name: Package release archive
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail

          archive_dir="dist"
          staging_dir="$archive_dir/${BINARY_NAME}-${TARGET}"
          archive_name="${BINARY_NAME}-${TAG}-${TARGET}.tar.gz"

          mkdir -p "$staging_dir"
          cp "target/${TARGET}/release/${BINARY_NAME}" "$staging_dir/"
          cp README.md LICENSE "$staging_dir/"
          tar -C "$archive_dir" -czf "$archive_dir/$archive_name" "$(basename "$staging_dir")"

      - name: Upload release archive
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    name: Create draft GitHub release
    needs:
      - prepare
      - build
    runs-on: ubuntu-26.04
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download release archives
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          merge-multiple: true
          path: dist

      - name: Create and push tag
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail

          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "tag '$TAG' already exists on origin" >&2
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" "$GITHUB_SHA" -m "Release $TAG"
          git push origin "refs/tags/$TAG"

      - name: Create draft release
        uses: softprops/action-gh-release@v3
        env:
          # Upstream's bundled Node code triggers DEP0005 (Buffer()).
          NODE_OPTIONS: --no-deprecation
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: ${{ needs.prepare.outputs.tag }}
          draft: true
          generate_release_notes: true
          files: dist/*.tar.gz
          fail_on_unmatched_files: true

# Cronk configuration — https://github.com/maurice/cronk
# Manual changes require an app restart to take effect.
# Copy the structure into your workspace config, or start with `cronk --init`.
# Never put access tokens in this file. IDs/paths below are illustrative.
onboarding = false # true opens first-run setup; also available with --onboarding
gitlab_url = "https://gitlab.company.example"
token_env = "GITLAB_TOKEN"
theme = "midnight" # midnight | dracula | light | blade-runner | tokyo-night | gruvbox-dark
                    # | nord | solarized-dark | solarized-light | sepia-dark | sepia-light
animations = true # false keeps hover feedback but disables click flashes
user_display = "username" # username | name | id
# When user_display = "name", optionally transform GitLab names with named regex captures:
# user_name_pattern = '^(?P<surname>\S+)\s+(?P<firstname>\S+)\s+(?P<staff_id>\d+)$'
# user_name_format = '$firstname'
list_refresh_secs = 60 # minimum 15
detail_refresh_secs = 10 # minimum 2; use 5 for faster details

[colors]
# accent = "#9B9FFF"
# background = "#101521"
# surface = "#192131"
# selection = "#293654"
# foreground = "#E5EAF5"
# muted = "#96A3BC"

# Add real projects through Ctrl+P -> Add existing GitLab project.
# [[projects]]
# id = 1234
# path = "company/division/team/planning"
# alias = "Planning"
# visible = true # master switch; preserves the two preferences below
# issues_visible = true # defaults to true; hidden types stop syncing
# merge_requests_visible = true # defaults to true; cached content is retained

# [[views]]
# name = "My iteration"
# kind = "issue"
# query = 'label:"team::payments" assignee:@me state:opened'

# Starred issues and merge requests (press `s`, or use the command palette). Their
# order is the order of the right-aligned "★ Starred" tab. Projects are identified
# by path so the list works on any machine that has those projects in its workspace.
# [[starred]]
# project = "company/division/team/planning"
# kind = "issue" # issue | merge_request
# iid = 42
# title = "Fallback title shown until the item has loaded"

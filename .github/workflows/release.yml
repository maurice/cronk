name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create (for example: v0.1.0)"
        required: true
        type: string

permissions:
  contents: read

env:
  BINARY_NAME: cronk
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    name: Validate release request
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.validate.outputs.tag }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Validate tag input
        id: validate
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          if [[ -z "$TAG" ]]; then
            echo "tag input must not be empty" >&2
            exit 1
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "tag '$TAG' already exists on origin" >&2
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.target }}
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross
        run: cargo install cross --git https://github.com/cross-rs/cross --locked

      - name: Build release binary
        env:
          CRONK_RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          GITHUB_SHA: ${{ github.sha }}
        run: cross build --locked --release --target ${{ matrix.target }} --bin $BINARY_NAME

      - name: Verify embedded release version
        env:
          CRONK_RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          GITHUB_SHA: ${{ github.sha }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail

          expected="${BINARY_NAME} ${CRONK_RELEASE_TAG}@${GITHUB_SHA:0:12}"
          actual="$(cross run --locked --release --target "$TARGET" --bin "$BINARY_NAME" -- --version)"
          if [[ "$actual" != "$expected" ]]; then
            echo "Release version mismatch: expected '$expected', got '$actual'" >&2
            exit 1
          fi
          echo "$actual"

      - name: Package release archive
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail

          archive_dir="dist"
          staging_dir="$archive_dir/${BINARY_NAME}-${TARGET}"
          archive_name="${BINARY_NAME}-${TAG}-${TARGET}.tar.gz"

          mkdir -p "$staging_dir"
          cp "target/${TARGET}/release/${BINARY_NAME}" "$staging_dir/"
          cp README.md LICENSE "$staging_dir/"
          tar -C "$archive_dir" -czf "$archive_dir/$archive_name" "$(basename "$staging_dir")"

      - name: Upload release archive
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    name: Create draft GitHub release
    needs:
      - prepare
      - build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download release archives
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          merge-multiple: true
          path: dist

      - name: Create and push tag
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail

          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "tag '$TAG' already exists on origin" >&2
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" "$GITHUB_SHA" -m "Release $TAG"
          git push origin "refs/tags/$TAG"

      - name: Create draft release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: ${{ needs.prepare.outputs.tag }}
          draft: true
          generate_release_notes: true
          files: dist/*.tar.gz
          fail_on_unmatched_files: true
